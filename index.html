<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broke In Progress</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1a1a2e;
    color: #fff;
    padding: 32px 16px 60px;
  }
  .header { text-align: center; margin-bottom: 24px; }
  h1 {
    font-size: 28px;
    background: linear-gradient(90deg, #ff6ec7, #ffb84d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 6px;
  }
  .subtitle { color: #aab; font-size: 14px; }
  .list {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #262643;
    border-radius: 14px;
    padding: 10px;
    text-decoration: none;
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    transition: transform 0.15s, box-shadow 0.15s;
    border: 1px solid #35355c;
  }
  .card:hover, .card:active {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(255,110,199,0.25);
    border-color: #7b2ff7;
  }
  .thumb {
    width: 64px;
    height: 64px;
    border-radius: 10px;
    object-fit: cover;
    background: #35355c;
    flex-shrink: 0;
  }
  .info { flex: 1; min-width: 0; }
  .name {
    font-weight: 600;
    font-size: 15px;
    line-height: 1.3;
    margin-bottom: 2px;
  }
  .date { font-size: 12px; color: #9aa; }
  .arrow { font-size: 20px; color: #7b2ff7; flex-shrink: 0; }
  .empty { text-align: center; color: #9aa; margin-top: 40px; }
</style>
</head>
<body>
  <div class="header">
    <h1>Broke In Progress</h1>
    <p class="subtitle">Tap the product you saw</p>
  </div>
  <div class="list" id="links">
    <p class="empty">Loading...</p>
  </div>
  <script>
    fetch('links.json')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('links');
        container.innerHTML = '';
        if (!data.length) {
          container.innerHTML = '<p class="empty">Nothing posted yet -- check back soon!</p>';
          return;
        }
        data.forEach(item => {
          const a = document.createElement('a');
          a.href = item.url;
          a.className = 'card';

          const img = document.createElement('img');
          img.className = 'thumb';
          img.src = item.image || '';
          img.alt = item.name;
          img.onerror = function() { this.style.display = 'none'; };
          a.appendChild(img);

          const info = document.createElement('div');
          info.className = 'info';
          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = item.name;
          const dateEl = document.createElement('div');
          dateEl.className = 'date';
          dateEl.textContent = item.date;
          info.appendChild(name);
          info.appendChild(dateEl);
          a.appendChild(info);

          const arrow = document.createElement('div');
          arrow.className = 'arrow';
          arrow.textContent = '→';
          a.appendChild(arrow);

          container.appendChild(a);
        });
      });
  </script>
</body>
</html>
