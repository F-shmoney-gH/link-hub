<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Broke In Progress</title>
<style>
body{font-family:sans-serif;background:#1a1a2e;color:#fff;text-align:center;padding:30px;}
h1{color:#ff6ec7;}
.link-btn{display:block;background:#7b2ff7;color:#fff;padding:14px;margin:14px auto 2px;max-width:320px;border-radius:8px;text-decoration:none;font-weight:bold;}
.link-btn:hover{background:#a94cff;}
.date{font-size:12px;color:#aaa;margin-bottom:6px;}
</style>
</head>
<body>
<h1>Broke As A Joke</h1>
<p>Tap the product you saw</p>
<div id="links">Loading...</div>
<script>
fetch('links.json').then(r => r.json()).then(data => {
  const container = document.getElementById('links');
  container.innerHTML = '';
  data.forEach(item => {
    const a = document.createElement('a');
    a.href = item.url;
    a.className = 'link-btn';
    a.textContent = item.name;
    container.appendChild(a);
    const d = document.createElement('div');
    d.className = 'date';
    d.textContent = item.date;
    container.appendChild(d);
  });
});
</script>
</body>
</html>
