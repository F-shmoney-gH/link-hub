<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broke In Progress</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background-color: #1a1a2e;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,110,199,0.18) 0, transparent 35%),
      radial-gradient(circle at 85% 15%, rgba(123,47,247,0.22) 0, transparent 40%),
      radial-gradient(circle at 50% 90%, rgba(255,184,77,0.14) 0, transparent 40%),
      radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: auto, auto, auto, 14px 14px;
    color: #fff;
    padding: 40px 16px 70px;
    min-height: 100vh;
  }

  .header { text-align: center; margin-bottom: 32px; }

  .badge {
    display: inline-block;
    background: #ffb84d;
    color: #1a1a2e;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
    border: 2px solid #1a1a2e;
  }

  h1 {
    font-size: 34px;
    font-weight: 800;
    background: linear-gradient(90deg, #ff6ec7, #ffb84d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    color: #cfd0e6;
    font-size: 15px;
    max-width: 340px;
    margin: 0 auto;
  }

  .grid {
    max-width: 900px;
    margin: 36px auto 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 20px;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: #22223f;
    border-radius: 18px;
    overflow: hidden;
    text-decoration: none;
    color: #fff;
    border: 3px solid #35355c;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .card:hover, .card:active {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 10px 24px rgba(255,110,199,0.3);
  }

  .card:nth-child(4n+1) { border-color: #ff6ec7; }
  .card:nth-child(4n+2) { border-color: #7b2ff7; }
  .card:nth-child(4n+3) { border-color: #2dd4bf; }
  .card:nth-child(4n+4) { border-color: #ffb84d; }

  .thumb-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #35355c;
    overflow: hidden;
  }

  .thumb {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .info { padding: 14px 14px 16px; flex: 1; display: flex; flex-direction: column; }

  .name {
    font-weight: 700;
    font-size: 15px;
    line-height: 1.35;
    margin-bottom: 8px;
    flex: 1;
  }

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .date { font-size: 11px; color: #9a9bc0; }

  .tap {
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #ffb84d;
  }

  .empty {
    text-align: center;
    color: #9a9bc0;
    margin-top: 40px;
    grid-column: 1 / -1;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    h1 { font-size: 28px; }
  }
</style>
</head>
<body>
  <div class="header">
    <span class="badge">New drop weekly</span>
    <h1>Broke In Progress</h1>
    <p class="subtitle">Tap the product you saw. Every fix, every week, all in one place.</p>
  </div>
  <div class="grid" id="links">
    <p class="empty">Loading...</p>
  </div>
  <script>
    fetch('links.json')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('links');
        container.innerHTML = '';
        if (!data.length) {
          container.innerHTML = '<p class="empty">Nothing posted yet -- check back soon!</p>';
          return;
        }
        data.forEach(item => {
          const a = document.createElement('a');
          a.href = item.url;
          a.className = 'card';

          const thumbWrap = document.createElement('div');
          thumbWrap.className = 'thumb-wrap';
          const img = document.createElement('img');
          img.className = 'thumb';
          img.src = item.image || '';
          img.alt = item.name;
          img.onerror = function() { thumbWrap.style.display = 'none'; };
          thumbWrap.appendChild(img);
          a.appendChild(thumbWrap);

          const info = document.createElement('div');
          info.className = 'info';
          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = item.name;
          const footerRow = document.createElement('div');
          footerRow.className = 'footer-row';
          const dateEl = document.createElement('div');
          dateEl.className = 'date';
          dateEl.textContent = item.date;
          const tapEl = document.createElement('div');
          tapEl.className = 'tap';
          tapEl.textContent = 'Shop →';
          footerRow.appendChild(dateEl);
          footerRow.appendChild(tapEl);
          info.appendChild(name);
          info.appendChild(footerRow);
          a.appendChild(info);

          container.appendChild(a);
        });
      });
  </script>
</body>
</html>
